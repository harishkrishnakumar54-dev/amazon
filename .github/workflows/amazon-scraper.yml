name: Amazon Playwright Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"  # 09:00 IST daily

permissions:
  contents: write

concurrency:
  group: amazon-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Amazon scraper
        env:
          PYTHONUNBUFFERED: "1"
          CI: "true"
        run: |
          echo "Amazon scraper started: $(date -u)"

          START=$(date +%s)

          python "main.py" --batch --headless

          END=$(date +%s)
          ELAPSED=$((END - START))

          echo "Amazon scraper finished: $(date -u)"
          echo "Runtime: ${ELAPSED} seconds"
          echo "Runtime: $((ELAPSED / 60)) minutes"

      - name: Upload logs and debug files
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: amazon-scraper-logs-and-debug
          path: |
            logs/**
            output/debug/**
          if-no-files-found: warn
          retention-days: 7

      - name: Commit updated Master Excel and database
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Checking generated files..."

          ls -lh output/Amazon_Seller_Master_Data.xlsx 2>/dev/null || true
          ls -lh amazon_sellers.db 2>/dev/null || true

          git status --short

          git add -- output/Amazon_Seller_Master_Data.xlsx amazon_sellers.db

          if git diff --cached --quiet; then
            echo "No Amazon data changes to commit."
          else
            git commit -m "Update Amazon seller master data"
            git push origin HEAD:main
          fi